<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPIT Portal — Loading</title>
<link rel="stylesheet" href="css/login.css">
<style>
body { display: grid; place-items: center; min-height: 100vh; background: #f4f7fd; }
.loading-box { text-align: center; padding: 32px; background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
.spinner { width: 36px; height: 36px; border: 3px solid #e0e7ff; border-top-color: #1a6cff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loading-box">
  <div class="spinner"></div>
  <p style="font-weight:600;color:#0a1b44;margin:0">Connecting to SPIT Portal…</p>
</div>
<script>
(async () => {
  try {
    const res = await fetch("api/session.php", { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      if (data.ok && data.logged_in) {
        if (data.role === "admin") {
          location.replace("admin.html");
          return;
        } else if (data.role === "student" && data.user && data.user.roll_no) {
          sessionStorage.setItem("spit_uid", data.user.roll_no);
          location.replace("dashboard.html");
          return;
        }
      }
    }
  } catch (err) {}
  location.replace("login.html");
})();
</script>
</body>
</html>
